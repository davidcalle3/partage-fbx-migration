# Insert BOTH locations inside the EXISTING HTTPS server { ... } block
# already serving Partage. Do not add these to the port-80 server.
# The app itself enforces HTTP Basic authentication (private credentials on VPS).
# Keep 8791 bound to 127.0.0.1; no firewall change is needed.

location = /fbx-migration {
    return 308 /fbx-migration/;
}

location ^~ /fbx-migration/ {
    # Trailing slash strips /fbx-migration/ before forwarding.
    proxy_pass http://127.0.0.1:8791/;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_buffering off;
}
